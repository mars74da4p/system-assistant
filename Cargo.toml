[package]
name = "system-assistant"
version = "1.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.28"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
